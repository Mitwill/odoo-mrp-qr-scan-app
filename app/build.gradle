apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply from: 'https://gist.githubusercontent.com/IlyaEremin/8821fbf0069e8e60dfeaeefc19afaca2/raw/ce54be4ea6f19b9609f303cd75714d6ec8d916e5/app_version.gradle'
// Add the Firebase Crashlytics plugin.
apply plugin: 'com.google.firebase.crashlytics'
android {
    signingConfigs {
        config {
            keyAlias 'android'
            keyPassword 'android'
            storeFile file('../mitwill_mrp.jks')
            storePassword 'android'
        }
    }
    compileSdkVersion 33
    buildToolsVersion "33.0.2"
    defaultConfig {
        multiDexEnabled true
        useLibrary 'org.apache.http.legacy'
        manifestPlaceholders = [applicationName: "MitWill"]
        applicationId "com.mitwill.mrp"
        minSdkVersion 19
        targetSdkVersion 34
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [applicationName: "Test MRP Mitwill"]
            signingConfig signingConfigs.config
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "server_url","https://test-eos.mitwilltextiles.com"
            resValue "string", "server_database_name", "mitwill_test_new_db"
            buildConfigField "String", 'BASE_URL', "\"https://test-eos.mitwilltextiles.com/mrp/\""
        }
        release {
            manifestPlaceholders = [applicationName: "MRP Mitwill"]
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            resValue "string", "server_url", "https://eos.mitwilltextiles.com"
            resValue "string", "server_database_name", "mitwill_prod"
            buildConfigField "String", 'BASE_URL', "\"https://eos.mitwilltextiles.com/mrp/\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.mitwill.mrp'
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "mitwill-MRP-${variant.name}-V${variant.versionName}.apk"
        }
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.vectordrawable:vectordrawable:1.0.1'
    implementation 'androidx.navigation:navigation-fragment:2.1.0'
    implementation 'androidx.navigation:navigation-ui:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation 'com.intuit.sdp:sdp-android:1.0.5'
    implementation 'com.jakewharton:butterknife:10.2.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.journeyapps:zxing-android-embedded:3.6.0'
    // Image picker
   // implementation 'com.opensooq.supernova:gligar:1.1.0'

//    implementation 'com.github.nguyenhoanglam:ImagePicker:1.5.1'
    implementation 'com.github.jkwiecien:EasyImage:1.3.1'


    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    // Recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    androidTestImplementation 'androidx.test:runner:1.3.0-alpha03'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0-alpha03'

    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.0'

    // Add the Firebase Crashlytics SDK.
    implementation 'com.google.firebase:firebase-crashlytics:17.3.0'

    // Recommended: Add the Google Analytics SDK.
    implementation 'com.google.firebase:firebase-analytics:18.0.0'

    // glide for image loader
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    // retrofit and ok http
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'


    implementation ('com.squareup.retrofit2:retrofit:2.1.0') {
        // exclude Retrofit’s OkHttp dependency module and define your own module import
        exclude module: 'okhttp'
    }
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'

}
